services:
  - type: web
    name: liminal-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements-prod.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: "*"
      - key: AZURE_OPENAI_DEPLOYMENT
        value: gpt-6-astra
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: FOUNDRY_PROJECT_ENDPOINT
        sync: false
